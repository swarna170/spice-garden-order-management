services:
  postgres:
    image: postgres:16
    container_name: spice-garden-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spice_garden
    ports:
      - "5432:5432"
    volumes:
      - spice_garden_data:/var/lib/postgresql/data

volumes:
  spice_garden_data: